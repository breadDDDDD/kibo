version: "3.9"

# Local Docker Compose
# - Runs API only.
# - DB connection should come from NEON_DATABASE_URL (or DATABASE_URL) in .env.
# - GCP services (Agent Search, Gemini) use ADC from your host machine.

x-adc-volume: &adc-volume
  type: bind
  source: ${ADC_PATH:-~/.config/gcloud/application_default_credentials.json}
  target: /gcp/gcp_creds.json
  read_only: true

services:
  api:
    build:
      context: .
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
    ports:
      - "8000:8080"
    env_file:
      - .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /gcp/gcp_creds.json
      APP_ENV: development
    volumes:
      - ./app:/app/app
      - ./templates:/app/templates
      - <<: *adc-volume
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
    restart: unless-stopped
